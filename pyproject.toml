[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelme-medphys-sam2"
version = "0.5.0"
description = "Semi-automatic annotation tool for biomedical and physical images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15", "qtpy!=1.11.2", "numpy>=1.24", "opencv-python>=4.8",
  "pydantic>=2.5,<3", "PyYAML>=6", "requests>=2.31",
  "imgviz>=0.11", "matplotlib", "natsort>=7.1", "Pillow>=9", "termcolor",
  "tifffile>=2023.7",
  "tifffile>=2023.7",
]

[project.optional-dependencies]
sam2 = ["torch", "torchvision", "hydra-core>=1.3", "iopath"]
dev = ["pytest>=8", "ruff>=0.6", "build"]

[project.scripts]
medphys-labelme = "app.main:main"
medphys-sam2-worker = "worker.main:main"

[tool.setuptools]
include-package-data = true
license-files = [
  "third_party/labelme_upstream/LICENSE",
  "third_party/sam2_upstream/LICENSE",
]

[tool.setuptools.package-dir]
labelme = "third_party/labelme_upstream/labelme"

[tool.setuptools.packages.find]
where = [".", "third_party/labelme_upstream"]
include = ["app*", "worker*", "project_format*", "labelme*"]

[tool.setuptools.package-data]
labelme = ["icons/*", "config/*.yaml", "translate/*.qm"]
app = ["config/*.yaml"]
project_format = ["schema/*.json"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
